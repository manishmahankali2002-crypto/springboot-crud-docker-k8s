
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-taskmanager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-taskmanager
  template:
    metadata:
      labels:
        app: springboot-taskmanager
    spec:
      containers:
        - name: springboot-taskmanager
          image: springboot-taskmanager:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: "host.minikube.internal"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "taskdb"
            - name: DB_USER
              value: "taskuser"
            - name: DB_PASSWORD
              value: "taskpassword"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
