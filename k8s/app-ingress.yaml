apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-crud-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: node-crud.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-crud-service
                port:
                  number: 80