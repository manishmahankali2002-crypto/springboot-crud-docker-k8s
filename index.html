<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000010;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .task-title {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .completed {
      text-decoration: line-through;
      color: #777;
    }

    .edit-btn {
      background: #e5e7eb;
    }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    #message {
      margin: 12px 0;
      color: #555;
      min-height: 20px;
    }

    @media (max-width: 480px) {
      .container { padding: 18px; }
      .task { flex-wrap: wrap; }
      .task-title { min-width: 60%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>My Task Manager</h1>
    <p>Create, view, update, and delete your tasks.</p>

    <form id="addForm" class="add-form">
      <input id="taskInput" placeholder="Enter a new task..." required maxlength="200">
      <button class="add-btn" type="submit">Add Task</button>
    </form>

    <p id="message" role="status"></p>
    <section id="taskList" aria-label="Tasks"></section>
  </main>

  <script>
    const API = "/tasks";
    const taskList = document.getElementById("taskList");
    const message = document.getElementById("message");
    const taskInput = document.getElementById("taskInput");

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...options.headers
        }
      });

      if (!response.ok) {
        throw new Error(await response.text() || "Request failed");
      }

      return response.json();
    }

    async function loadTasks() {
      try {
        const tasks = await request(API);
        taskList.replaceChildren();

        if (tasks.length === 0) {
          taskList.textContent = "No tasks yet. Add your first task!";
          return;
        }

        tasks.forEach(task => {
          const row = document.createElement("div");
          row.className = "task";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", "Mark task complete");
          checkbox.addEventListener("change", async () => {
            try {
              await request(`${API}/${task.id}`, {
                method: "PUT",
                body: JSON.stringify({
                  completed: checkbox.checked
                })
              });
              message.textContent = "Task updated.";
              await loadTasks();
            } catch (error) {
              message.textContent = error.message;
              await loadTasks();
            }
          });

          const title = document.createElement("span");
          title.className = "task-title";
          title.textContent = task.title;
          if (task.completed) title.classList.add("completed");

          const edit = document.createElement("button");
          edit.className = "edit-btn";
          edit.textContent = "Edit";
          edit.addEventListener("click", async () => {
            const newTitle = prompt("Edit task:", task.title);
            if (newTitle === null) return;
            if (!newTitle.trim()) {
              message.textContent = "Task title cannot be empty.";
              return;
            }

            try {
              await request(`${API}/${task.id}`, {
                method: "PUT",
                body: JSON.stringify({ title: newTitle.trim() })
              });
              message.textContent = "Task updated.";
              await loadTasks();
            } catch (error) {
              message.textContent = error.message;
            }
          });

          const remove = document.createElement("button");
          remove.className = "delete-btn";
          remove.textContent = "Delete";
          remove.addEventListener("click", async () => {
            if (!confirm(`Delete "${task.title}"?`)) return;

            try {
              await request(`${API}/${task.id}`, {
                method: "DELETE"
              });
              message.textContent = "Task deleted.";
              await loadTasks();
            } catch (error) {
              message.textContent = error.message;
            }
          });

          row.append(checkbox, title, edit, remove);
          taskList.appendChild(row);
        });
      } catch (error) {
        message.textContent = "Could not load tasks. Is the server running?";
      }
    }

    document.getElementById("addForm").addEventListener("submit", async event => {
      event.preventDefault();
      const title = taskInput.value.trim();
      if (!title) return;

      try {
        await request(API, {
          method: "POST",
          body: JSON.stringify({ title })
        });
        taskInput.value = "";
        message.textContent = "Task created.";
        await loadTasks();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    loadTasks();
  </script>
</body>
</html>
